<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>CapitalBuzz</title>
<style>
  :root {
    --page: #ffffff; --ink: #111111; --muted: #6f6f6c; --line: #e6e6e3;
    --bar: #ffffff; --chip: #f6f6f4; --chip-on: #111111; --chip-on-ink: #ffffff;
    --surface: #ffffff;
  }
  html[data-theme="dark"] {
    --page: #111111; --ink: #f2f2f0; --muted: #9a9a96; --line: #2e2e2c;
    --bar: #111111; --chip: #1c1c1c; --chip-on: #f2f2f0; --chip-on-ink: #111111;
    --surface: #171717;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--page); color: var(--ink); }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  .bar {
    position: sticky; top: 0; z-index: 40;
    height: 48px; padding: 0 16px;
    border-bottom: 2px solid var(--ink);
    display: flex; align-items: center; gap: 14px;
    background: var(--bar);
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.05rem; font-weight: 600; text-decoration: none; color: inherit;
    flex: 0 0 auto;
  }
  .bolt { width: 0.9em; height: 0.9em; display: block; }
  .dates {
    display: flex; align-items: center; gap: 6px;
    overflow-x: auto; min-width: 0; flex: 1;
    scrollbar-width: none;
  }
  .dates::-webkit-scrollbar { display: none; }
  .dates a {
    flex: 0 0 auto;
    padding: 5px 10px; border-radius: 999px;
    background: var(--chip); color: var(--ink);
    text-decoration: none; font-size: 0.78rem; font-weight: 600;
    white-space: nowrap;
  }
  .dates a[aria-current="page"] { background: var(--chip-on); color: var(--chip-on-ink); }
  .theme-btn {
    width: 34px; height: 34px; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); border-radius: 999px; cursor: pointer; display: grid; place-items: center; padding: 0;
    flex: 0 0 auto;
  }
  .theme-btn:hover { border-color: var(--ink); }
  .theme-btn svg { width: 16px; height: 16px; }
  .icon-sun { display: none; }
  html[data-theme="dark"] .icon-moon { display: none; }
  html[data-theme="dark"] .icon-sun { display: block; }
  #page header, #page .tools, #page .theme-btn { display: none !important; }
</style>
<style id="brief-css"></style>
</head>
<body>
  <nav class="bar">
    <a class="brand" href="./#current">
      <svg class="bolt" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13 2 4 14h7l-1 8 10-12h-7z"/></svg>
      CapitalBuzz
    </a>
    <div class="dates" id="dates"></div>
    <button type="button" class="theme-btn" id="theme-toggle" aria-label="Switch to dark theme" title="Dark">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 14.3A8.5 8.5 0 0 1 9.7 3 7.5 7.5 0 1 0 21 14.3z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </nav>
  <div id="page"></div>
<script>
(function () {
  var nav = document.getElementById("dates");
  var page = document.getElementById("page");
  var moon = document.getElementById("theme-toggle");
  var briefCss = document.getElementById("brief-css");
  function themeNow() {
    try { return localStorage.getItem("cb-theme") || "light"; } catch (e) { return "light"; }
  }
  function applyTheme(theme) {
    if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
    else document.documentElement.removeAttribute("data-theme");
    try { localStorage.setItem("cb-theme", theme); } catch (e) {}
    var dark = theme === "dark";
    moon.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
    moon.title = dark ? "Light" : "Dark";
  }
  applyTheme(themeNow());
  moon.addEventListener("click", function () {
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });
  function bindCollapse() {
    var collapsed = {};
    try { collapsed = JSON.parse(localStorage.getItem("cb-collapsed") || "{}") || {}; } catch (e) {}
    var sections = Array.prototype.slice.call(page.querySelectorAll("section[id]"));
    function save() {
      try { localStorage.setItem("cb-collapsed", JSON.stringify(collapsed)); } catch (e) {}
    }
    function allClosed() {
      return sections.every(function (sec) {
        var d = sec.querySelector("details");
        return d && !d.open;
      });
    }
    function syncAllBtn() {
      var btn = document.getElementById("collapse-all");
      if (!btn) return;
      var closed = allClosed();
      btn.setAttribute("data-all", closed ? "closed" : "open");
      btn.setAttribute("aria-label", closed ? "Expand all" : "Collapse all");
      btn.title = closed ? "Expand all" : "Collapse all";
    }
    sections.forEach(function (sec) {
      var d = sec.querySelector("details");
      if (!d) return;
      if (collapsed[sec.id]) d.removeAttribute("open");
      d.addEventListener("toggle", function () {
        collapsed[sec.id] = !d.open;
        save();
        syncAllBtn();
      });
    });
    var allBtn = document.getElementById("collapse-all");
    if (allBtn) {
      allBtn.addEventListener("click", function () {
        var close = !allClosed();
        sections.forEach(function (sec) {
          var d = sec.querySelector("details");
          if (!d) return;
          if (close) d.removeAttribute("open");
          else d.setAttribute("open", "");
          collapsed[sec.id] = close;
        });
        save();
        syncAllBtn();
      });
    }
    syncAllBtn();
  }
  function show(file) {
    fetch(file, { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (html) {
      var parsed = new DOMParser().parseFromString(html, "text/html");
      var css = "";
      Array.prototype.forEach.call(parsed.querySelectorAll("style"), function (s) { css += s.textContent + "\n"; });
      briefCss.textContent = css;
      var hdr = parsed.querySelector("header");
      if (hdr) hdr.remove();
      Array.prototype.forEach.call(parsed.querySelectorAll("script"), function (s) { s.remove(); });
      page.innerHTML = parsed.body.innerHTML;
      bindCollapse();
      applyTheme(themeNow());
    });
  }
  function hash() { return (location.hash || "").replace(/^#/, ""); }
  function pick(list) {
    var h = hash();
    if (!h || h === "current") return list[0];
    for (var i = 0; i < list.length; i++) if (list[i].date === h) return list[i];
    return list[0];
  }
  function chip(href, label, on) {
    var a = document.createElement("a");
    a.href = href;
    a.textContent = label;
    if (on) a.setAttribute("aria-current", "page");
    return a;
  }
  function draw(list, current) {
    nav.innerHTML = "";
    var latest = list[0];
    var onCurrent = current.date === latest.date;
    nav.appendChild(chip("#current", "Current", onCurrent));
    list.slice(1).forEach(function (item) {
      nav.appendChild(chip("#" + item.date, item.label, item.date === current.date));
    });
    show(current.file);
    document.title = onCurrent ? "CapitalBuzz" : "CapitalBuzz — " + current.label;
  }
  function load(list) {
    if (!list || !list.length) return;
    draw(list, pick(list));
    window.onhashchange = function () { draw(list, pick(list)); };
  }
  fetch("briefs.json", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(load)
    .catch(function () {
      load([{ date: "2026-08-28", label: "Fri Aug 28", file: "capitalbuzz-2026-08-28.html" }]);
    });
})();
</script>
</body>
</html>
